services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nino
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nino"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/nino?sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
    command: ["sh", "-c", "psql \"$${DATABASE_URL}\" -v ON_ERROR_STOP=1 -f /migrations/001_create_users.sql"]

  api:
    build: .
    environment:
      NINO_CONFIG_PATH: /app/configs/app.yaml
      NINO_DATABASE_URL: postgres://postgres:postgres@db:5432/nino?sslmode=disable
      NINO_HTTP_ADDR: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  grpc:
    build: .
    entrypoint: ["/app/grpc-server"]
    environment:
      NINO_CONFIG_PATH: /app/configs/app.yaml
      NINO_DATABASE_URL: postgres://postgres:postgres@db:5432/nino?sslmode=disable
      NINO_GRPC_ADDR: :9090
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9090"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
